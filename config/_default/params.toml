# ============================================================
#  主题参数（Stack）
# ============================================================

# 主页 / 搜索索引要收录哪些内容区
# ← 目前只有一个：posts（唯一的正文区，文章不分类）
#   将来若拆出独立栏目，同步改这里、menu.toml、content/ 下的目录、README 的目录树
mainSections   = ["posts"]
rssFullContent = true
SortBy         = "default"

[footer]
    since      = 2026
    # 站点的起始时刻，「本站已运行」计时器读的是这里的 data-since。
    # 改时间只改这一处，脚本不用动。
    customText = '本站已运行 <span id="site-runtime" data-since="2026-10-12T21:00:00+08:00">—</span>'

[dateFormat]
    # 精确到分钟：文章什么时候写的，列表页一眼能看到
    published   = "2006-01-02 15:04"
    lastUpdated = "2006-01-02 15:04"

[sidebar]
    compact  = false
    avatar   = ""
    subtitle = "想到什么写什么"

[article]
    headingAnchor = true   # 标题带锚点，方便引用某一小节
    math          = true   # ★ 全局开启 KaTeX —— 不必每篇写 math: true
    toc           = true
    readingTime   = false  # 不显示「X 分钟阅读」—— 短文多，这个估算没意义

    [article.list]
        # 站里不打标签，列表页就不必留标签的位置
        showTags = false

    [article.license]
        enabled = false
        default = ""

    # Mermaid 图表：直接写 ```mermaid 代码块即可，无需短代码
    [article.mermaid]
        look                  = "classic"
        lightTheme            = "default"
        darkTheme             = "dark"
        securityLevel         = "loose"   # 允许在标签里用 <br/> 换行
        htmlLabels            = true
        transparentBackground = true

    [article.alertIcon]
        note      = "📝"
        tip       = "💡"
        important = "📌"
        warning   = "⚠️"
        caution   = "🚨"

# 侧边栏部件
# 注意：必须是带 type 字段的对象，不能写成字符串数组
#
# ⚠️ 这里配什么，右侧栏就多一个块（没有配就是空的右栏）。
# 2026-10-12 晚：用户要求**去掉首页右侧栏的搜索与归档** —— 那两个和左侧导航
# 里的「搜索 / 归档」重复，右侧栏又正好被右上角的唱片播放器压住，
# 所以 [[widgets.homepage]] 整段撤掉，右栏在首页与列表页不再出现。
# 搜索走左侧导航的「搜索」页，归档走左侧导航的「归档」（可展开成文章标题）。
#
# 历史上还配过 categories 与 tag-cloud 两个部件。本站文章不分类、不打标签，
# 那两个部件渲染出来是空的，还会让 Hugo 每次构建都打
# `WARN Taxonomy categories not found` / `WARN Taxonomy tags not found`。
# 将来启用分类或标签时，再把对应的部件加回来即可。
#
# [[widgets.page]] 保留：文章页右侧的目录（TOC）靠它。

[[widgets.page]]
    type = "toc"

[opengraph.twitter]
    site = ""
    card = "summary_large_image"

[colorScheme]
    toggle  = true
    # 默认配色。auto = 跟随系统；dark = 新访客一律先看到深色（仍可用左下角按钮切换）。
    # 只对「本机没存过偏好」的访客生效，改过的人保持自己的选择。
    default = "dark"

[imageProcessing]
    autoOrient = false

    [imageProcessing.content]
        widths  = [800, 1600, 2400]
        enabled = true

    [imageProcessing.thumbnail]
        enabled = true

[cookies]
    enabled = false

# 评论：先用 Waline（自建，数据在自己服务器上）
# 服务器搭好之前保持 enabled = false，否则前台会报错
[comments]
    enabled  = false
    provider = "waline"

    [comments.waline]
        serverURL    = ""   # 搭好后填 https://comments.你的域名/
        lang         = "zh-CN"
        pageview     = false
        emoji        = ["https://unpkg.com/@waline/emojis@1.0.1/weibo"]
        requiredMeta = ["nick"]

        [comments.waline.locale]
            admin       = "博主"
            placeholder = "说点什么…"

# ============================================================
#  背景音乐（右上角黑胶唱片，自研组件）
#
#  两种音源，由 source 决定：
#
#  · source = "api"    走第三方 Meting 接口，不用自己准备文件。
#      ⚠️ 换 QQ 音乐（server = "tencent"）之前先读这段：
#        2026-10-12 实测，tencent 的元数据（歌名 / 封面 / 歌词）正常，
#        但**音频直链约七成取不到** —— 接口回 200 加一个空响应体，
#        是被版权 / VIP 挡住，不是接口坏了。
#        **有 QQ 音乐会员也救不了**：① 公共接口走它自己服务端的登录态，
#        传 cookie / uin 参数与不传的结果完全一致；② 就算自建接口把 VIP
#        cookie 塞进去，回的是 .mflac / .mgg 加密音频，<audio> 解不了
#        （2024 起改成 STag 加密，unlock-music 那类工具也大面积失效）；
#        ③ 自建还要一台常驻服务器，跟纯静态托管的方案冲突。
#        播放器遇到取不到的音源会自动跳下一首并飘一条提示。
#        网易云目前取流 100%，要全都能听就把 server 换回 netease。
#
#  · source = "local"  放自己的音频文件，100% 能播、一个请求都不用发。
#      把音频丢进 assets/music/，文件名写成「歌手 - 歌名.mp3」，
#      同名 .jpg 会被当作封面；重新构建即可，歌单自动生成，不用手写列表。
#      ⚠️ 音频文件会进 git 仓库，别放体积太大的东西。
#      ⚠️ 把自己下载的商业音乐放到公开网站上分发有版权风险，自己权衡。
#
#  逻辑在 assets/ts/custom.ts 的 setupMusicPlayer()
#  样式在 assets/css/custom.css 的「右上角唱片播放器」一节
#  api 那一行也别随手换：公共实例里只有 qijieya 给完整版（不带 CORS 的
#  GD Studio 也给整首，但浏览器跨域取不到，白搭）。
# ============================================================
[music]
    enable   = true
    source   = "api"           # api / local

    # ---- source = "api" 时才用到 ----
    #   ★ 换自己的歌单：网易云网页版地址里 playlist?id= 后面那串数字，
    #     填到下面 id，再把 title 改成你的歌单名，其余不用动。
    #   ★ 想放多张歌单：id 用逗号隔开写多个，会自动合并成一份列表并去重。
    id       = "18480725633,18480699721"   # PIEEE + 我喜欢的音乐（合并去重）
    server   = "netease"       # netease / tencent / kugou
    type     = "playlist"      # playlist / album / artist / song
    api      = "https://api.qijieya.cn/meting/?server=:server&type=:type&id=:id"

    # ★ 专门用来「读歌单」的第二家接口 —— 音频仍然只走上面的 api。
    #   为什么需要它：Meting 系公共实例普遍把歌单结果**缓存 24 小时**
    #   （injahow 源码里 CACHE_TIME = 86400），你刚往歌单里加的歌最长要等一天才出现。
    #   i-meto 不缓存，实测加完立刻能读到；它的直链取不到音频（回 401 / 404），
    #   所以脚本把列表里每首歌重新接到 api 上取流。
    #   留空字符串 = 关掉这个优化，只用 api 读列表（会慢一天）。
    listapi  = "https://api.i-meto.com/meting/api?server=:server&type=:type&id=:id"

    title    = "我的歌单"       # 面板顶部的歌单名，换成自己的歌单后记得一起改
    # 初始播放模式。面板底部那排按钮随时可切，选完记在浏览器里，下次打开还是它。
    #   shuffle 随机 / order 顺序 / reverse 逆序 / single 单曲循环
    order    = "shuffle"
    volume   = 0.5
    accent   = "#5b7cfa"       # 进度条与当前曲目的高亮色

    # ---- 进站自动播放 ----
    # 浏览器不允许「没被用户点过就给声音」，静音才放行，这是硬限制，前端绕不过去。
    # 打开后走的是「尽量早 + 兜底」：
    #   ① 页面一加载就试播 —— 访客之前在本站交互过、或刚点文章链接进来时，
    #      这一次往往直接就成了，进门就有声音；
    #   ② 被拦下就挂一组一次性监听，他第一次点击 / 按键 / 滚动 / 触摸时立刻补播，
    #      不用去右上角找播放按钮，随便动一下就行。
    # 等待期间唱片上会有一圈呼吸光圈和「点一下播放」的气泡作为引导。
    autoplay = true

    # 跨页续播：Hugo 是多页站点，点进文章会整页刷新，音频本来每次都要重来。
    # 打开后把「播到哪了」记在 sessionStorage（关掉标签页即失效），
    # 新页面接着上次的进度放 —— 翻文章的时候歌不会断。
    resume   = true

# ============================================================
#  访问统计（A 方案：Cloudflare Web Analytics，免服务器）
#
#  A 方案里统计不跑 Umami，改用 Cloudflare Web Analytics：
#  零运维、不写 cookie、不采集个人信息，脚本是 defer 的，不拖慢首屏。
#
#  ★ 怎么拿 token：
#    1. 登录 dash.cloudflare.com（没有账号就免费注册一个）
#    2. Analytics & Logs → Web Analytics → Add a site
#    3. hostname 填你线上那个域名（如 blzrw-blog-43569.app.workbuddy.host）
#    4. 选「JavaScript snippet」方式，复制 data-cf-beacon 里 "token" 那串
#    5. 把 token 贴到下面，enable 改成 true，再重新发布一次才生效
#
#  没填 token 时这段脚本完全不输出，页面上不会有任何多余请求。
# ============================================================
[analytics]
    enable = false             # ★ 拿到 token 后改成 true
    token  = ""                # ★ 粘贴 Cloudflare 给你的 token
