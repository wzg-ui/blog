# ============================================================
#  主题参数（Stack）
# ============================================================

# 主页 / 搜索索引要收录哪些内容区
# ← 目前只有一个：posts（唯一的正文区，文章不分类）
#   将来若拆出独立栏目，同步改这里、menu.toml、content/ 下的目录、README 的目录树
mainSections   = ["posts"]
rssFullContent = true
SortBy         = "default"

[footer]
    since      = 2026
    # 站点的起始时刻，「本站已运行」计时器读的是这里的 data-since。
    # 改时间只改这一处，脚本不用动。
    customText = '本站已运行 <span id="site-runtime" data-since="2026-10-12T21:00:00+08:00">—</span>'

[dateFormat]
    # 精确到分钟：文章什么时候写的，列表页一眼能看到
    published   = "2006-01-02 15:04"
    lastUpdated = "2006-01-02 15:04"

[sidebar]
    compact  = false
    avatar   = ""
    subtitle = "想到什么写什么"

[article]
    headingAnchor = true   # 标题带锚点，方便引用某一小节
    math          = true   # ★ 全局开启 KaTeX —— 不必每篇写 math: true
    toc           = true
    readingTime   = true

    [article.list]
        # 站里不打标签，列表页就不必留标签的位置
        showTags = false

    [article.license]
        enabled = false
        default = ""

    # Mermaid 图表：直接写 ```mermaid 代码块即可，无需短代码
    [article.mermaid]
        look                  = "classic"
        lightTheme            = "default"
        darkTheme             = "dark"
        securityLevel         = "loose"   # 允许在标签里用 <br/> 换行
        htmlLabels            = true
        transparentBackground = true

    [article.alertIcon]
        note      = "📝"
        tip       = "💡"
        important = "📌"
        warning   = "⚠️"
        caution   = "🚨"

# 侧边栏部件
# 注意：必须是带 type 字段的对象，不能写成字符串数组
#
# 曾经配过 categories 与 tag-cloud 两个部件。本站文章不分类、不打标签，
# 这两个部件渲染出来是空的，还会让 Hugo 每次构建都打
# `WARN Taxonomy categories not found` / `WARN Taxonomy tags not found`。
# 将来启用分类或标签时，把对应的 [[widgets.homepage]] 块加回来即可。

[[widgets.homepage]]
    type = "search"

[[widgets.homepage]]
    type = "archives"

[[widgets.page]]
    type = "toc"

[opengraph.twitter]
    site = ""
    card = "summary_large_image"

[colorScheme]
    toggle  = true
    # 默认配色。auto = 跟随系统；dark = 新访客一律先看到深色（仍可用左下角按钮切换）。
    # 只对「本机没存过偏好」的访客生效，改过的人保持自己的选择。
    default = "dark"

[imageProcessing]
    autoOrient = false

    [imageProcessing.content]
        widths  = [800, 1600, 2400]
        enabled = true

    [imageProcessing.thumbnail]
        enabled = true

[cookies]
    enabled = false

# 评论：先用 Waline（自建，数据在自己服务器上）
# 服务器搭好之前保持 enabled = false，否则前台会报错
[comments]
    enabled  = false
    provider = "waline"

    [comments.waline]
        serverURL    = ""   # 搭好后填 https://comments.你的域名/
        lang         = "zh-CN"
        pageview     = false
        emoji        = ["https://unpkg.com/@waline/emojis@1.0.1/weibo"]
        requiredMeta = ["nick"]

        [comments.waline.locale]
            admin       = "博主"
            placeholder = "说点什么…"

# ============================================================
#  背景音乐（右上角黑胶唱片，自研组件）
#
#  上一版是 APlayer + MetingJS 的左下角浮层，2026-10-12 换掉：
#  浮层太大、位置抢眼，改成右上角一张会转的黑胶唱片 ——
#  收起时只占 62px，点开才展开歌单，从列表里点哪首放哪首。
#
#  逻辑在 assets/ts/custom.ts 的 setupMusicPlayer()
#  样式在 assets/css/custom.css 的「右上角唱片播放器」一节
#
#  ⚠️ 换 QQ 音乐（server = "tencent"）之前先读这段：
#     2026-10-12 实测，tencent 的元数据（歌名 / 封面 / 歌词）正常，
#     但**音频直链约七成取不到** —— 接口回 200 加一个空响应体，
#     是被版权 / VIP 挡住，不是接口坏了。播放器遇到会自动跳下一首，
#     并在面板顶部提示「取不到音源」。网易云目前取流成功率是 100%。
#     ⇒ 想放 QQ 音乐就得接受这个折损；要全都能听，就换回 netease。
#
#  ⚠️ api 那一行也别随手换：实测只有 injahow 这家能取到真音频，
#     i-meto 的取直链端点对所有平台都返回「服务器未知异常」。
#     详见 static/aplayer/README.md
# ============================================================
[music]
    enable   = true

    # ★ 换成自己的歌：在对应平台建一个歌单，把歌加进去，再把 id 填过来。
    #   网易云 → 网页版地址里 playlist?id= 后面那串数字
    #   QQ 音乐 → 网页版地址里 playlist/ 后面那串数字（disstid）
    id       = "7011264340"    # 现在是一张 QQ 音乐示例歌单（76 首），换成你自己的
    server   = "tencent"       # netease / tencent / kugou
    type     = "playlist"      # playlist / album / artist / song
    api      = "https://api.injahow.cn/meting/?server=:server&type=:type&id=:id"

    title    = "QQ 音乐歌单"    # 面板顶部的歌单名，换成自己的歌单后记得一起改
    order    = "random"        # random / list —— 放完一首后随机还是按列表顺序
    volume   = 0.5
    accent   = "#5b7cfa"       # 进度条与当前曲目的高亮色
    autoplay = false           # 浏览器会拦截自动播放，开了也没用

# ============================================================
#  访问统计（A 方案：Cloudflare Web Analytics，免服务器）
#
#  A 方案里统计不跑 Umami，改用 Cloudflare Web Analytics：
#  零运维、不写 cookie、不采集个人信息，脚本是 defer 的，不拖慢首屏。
#
#  ★ 怎么拿 token：
#    1. 登录 dash.cloudflare.com（没有账号就免费注册一个）
#    2. Analytics & Logs → Web Analytics → Add a site
#    3. hostname 填你线上那个域名（如 blzrw-blog-43569.app.workbuddy.host）
#    4. 选「JavaScript snippet」方式，复制 data-cf-beacon 里 "token" 那串
#    5. 把 token 贴到下面，enable 改成 true，再重新发布一次才生效
#
#  没填 token 时这段脚本完全不输出，页面上不会有任何多余请求。
# ============================================================
[analytics]
    enable = false             # ★ 拿到 token 后改成 true
    token  = ""                # ★ 粘贴 Cloudflare 给你的 token
