# ============================================================
#  导航菜单
#
#  这里只放「手工声明」的菜单项。主题自带的两个页面导航项不在这里 ——
#  它们写在各自页面的 front matter 里（menu.main）：
#     content/page/search/index.md     搜索   weight -60
#     content/page/archives/index.md   归档   weight -50
#
#  最终顺序（按 weight 升序）：主页 → 搜索 → 归档 → 投稿
#
#  曾经的 [[main]] posts（「文章」）已删除：/posts/ 栏目页不再生成
#  （见 content/posts/_index.md 的 build 设置），首页就是文章入口。
# ============================================================

# 「主页」直接指向站点根目录。首页本身就是文章列表（置顶区 + 常规列表），
# 点卡片标题即可进入文章 —— 所以这里不需要另建页面，给个入口就行。
# 摆在最前面是学 haxo 那站：导航第一项永远是回到文章流。
[[main]]
    identifier = "home"
    name       = "主页"
    url        = "/"
    weight     = -70

    [main.params]
        icon = "home"

# 「Special Gift」—— 生日惊喜入口。
# 只在 unlockAt ~ expireAt 之间显示（10-15 00:00 到 10-16 00:00），
# 时间判断在 custom.ts 的 setupGiftMenu()，靠下面这两个时间戳驱动。
# 模板负责把这两个值写进 data-gift-* 属性。
[[main]]
    identifier = "gift"
    name       = "Special Gift"
    url        = "/gift/"
    weight     = -45

    [main.params]
        icon      = "gift"
        giftUnlock = "2026-10-15T00:00:00+08:00"
        giftExpire = "2026-10-16T00:00:00+08:00"

# 投稿入口。放主菜单而不是只放页脚 —— 页脚那行小字跟版权信息混在一起，
# 没人会注意到，而这才是别人想写东西时唯一要找的地方。
[[main]]
    identifier = "contribute"
    name       = "投稿"
    url        = "https://github.com/wzg-ui/blog/issues/new/choose"
    weight     = -40

    [main.params]
        icon   = "messages"
        newTab = true

# 侧边栏底部的小图标。外链一律新标签页打开（newTab）。
[[social]]
    identifier = "github"
    name       = "GitHub"
    url        = "https://github.com/wzg-ui"

    [social.params]
        icon   = "brand-github"
        newTab = true
