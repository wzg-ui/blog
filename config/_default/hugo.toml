# ============================================================
#  站点主配置
#  Hugo 0.167.0 extended  +  Stack 4.0.3
# ============================================================

# baseURL 用根相对路径：这样无论挂到 Cloudflare Pages、自有域名还是本地预览，
# 都不会出现「站内链接全指向 example.com」这个经典事故。
# Cloudflare Pages 构建时用 -b "$CF_PAGES_URL" 覆盖它，canonical 与 RSS 便成为绝对地址。
baseURL = "/"
title   = "BLZRW's Blog"

locale                 = "zh-cn"
defaultContentLanguage = "zh"
# 中文站必须开：影响 .Summary 截断与 .WordCount 的统计口径
hasCJKLanguage         = true
timeZone               = "Asia/Shanghai"

theme           = "hugo-theme-stack"
enableRobotsTXT = true
enableEmoji     = true
summaryLength   = 120

[pagination]
    pagerSize = 10

# 内容目录即 URL。page 目录（关于/搜索）用 slug 作一级路径，
# 其余内容保持 content/ 下的目录层级，例如：
#   content/math/linear-algebra/eigenvalue.md
#     -> /math/linear-algebra/eigenvalue/
[permalinks]
    page = "/:slug/"

# 关掉不需要的输出格式，减少构建产物
[outputs]
    section = ["HTML"]

[services]
    [services.googleAnalytics]
        ID = ""

[privacy]
    [privacy.googleAnalytics]
        disable = true
