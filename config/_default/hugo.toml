# ============================================================
#  站点主配置
#  Hugo 0.167.0 extended  +  Stack 4.0.3
# ============================================================

# 站点正式地址（自定义域名）。必须是绝对地址：
# 否则 sitemap / RSS / og:url 全是相对路径，分享卡片和搜索引擎拿不到真实地址。
# 本地预览不受影响 —— hugo server 会自动把它覆盖成 http://localhost:1313/。
# 换域名时只改这一行。
baseURL = "https://blog.piemm.net/"
title   = "PIEMM's Blog"

locale                 = "zh-cn"
defaultContentLanguage = "zh"
# 中文站必须开：影响 .Summary 截断与 .WordCount 的统计口径
hasCJKLanguage         = true
timeZone               = "Asia/Shanghai"

theme           = "hugo-theme-stack"
enableRobotsTXT = true
enableEmoji     = true
summaryLength   = 120

# 分类法只开 series 一个 —— 「专栏」靠它聚合。
#
# ⚠️ 写了 [taxonomies] 就是整体替换 Hugo 默认的 tag / category：
#    没声明的分类法压根不存在，所以不需要 disableKinds 去关，
#    也不会生成 /tags/ /categories/ 那两个空列表页。
# 效果：/series/ 是专栏总览，/series/python/ 是「重拾 Python」专栏页。
# 以后加新专栏，只在文章 front matter 里写 series: ["新名字"] 就行。
#
# ⚠️ 必须留在所有其他 [表头] 之前的理解依旧成立：TOML 里表头之后的键
#    属于那张表，写错位置会被解析成 pagination.taxonomies，完全无效。
[taxonomies]
    series = "series"

[pagination]
    pagerSize = 10

# 内容目录即 URL。page 目录（关于/搜索）用 slug 作一级路径，
# 其余内容保持 content/ 下的目录层级，例如：
#   content/posts/segment-tree-range-sum.md
#     -> /posts/segment-tree-range-sum/
[permalinks]
    page = "/:slug/"

# 关掉不需要的输出格式，减少构建产物
[outputs]
    section = ["HTML"]

[services]
    [services.googleAnalytics]
        ID = ""

[privacy]
    [privacy.googleAnalytics]
        disable = true
