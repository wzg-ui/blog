name: 构建检查

# 每次 push 到 main 都会跑一次构建。
# 目的有两个：
#   1. 早发现问题 —— 配置写错时在 CI 里就报错，而不是等部署到线上才发现
#   2. 产出可下载的站点压缩包，方便随时取回一个可用的版本
#
# 正式发布由 Cloudflare Pages 直连仓库自动完成，因此这里不重复部署。
# 若你更想让 Actions 负责部署，见文件末尾的注释。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: 0.167.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 主题是内嵌在仓库里的（themes/ 目录），不需要拉子模块
          submodules: false
          fetch-depth: 0

      - name: 安装 Hugo extended
        run: |
          set -e
          wget -q -O hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "$HOME/.local/bin"
          tar -xzf hugo.tar.gz -C "$HOME/.local/bin"
          rm -f hugo.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          hugo version

      - name: 构建站点
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --gc --minify --logLevel info

      - name: 校验关键文件已产出
        run: |
          set -e
          for f in public/index.html \
                   public/katex/katex.min.css \
                   public/mermaid/mermaid.min.js \
                   public/search/index.json; do
            if [ ! -f "$f" ]; then
              echo "::error::构建产物缺少 $f"
              exit 1
            fi
          done
          echo "关键文件检查通过"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: public
          retention-days: 7

