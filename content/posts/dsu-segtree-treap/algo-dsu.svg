<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="并查集路径压缩前后的树形对比">
  <defs>
    <marker id="dsu-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- 分隔线 -->
  <line x1="300" y1="34" x2="300" y2="266" stroke="#c8823a" stroke-width="1" stroke-dasharray="4 5" opacity="0.55"/>

  <!-- 左：压缩前 -->
  <g stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#dsu-arrow)">
    <line x1="140" y1="100" x2="140" y2="74"/>
    <line x1="140" y1="166" x2="140" y2="140"/>
    <line x1="140" y1="232" x2="140" y2="206"/>
    <line x1="222" y1="107" x2="157" y2="66"/>
  </g>
  <g fill="none" stroke="#8a8a8a" stroke-width="1.5">
    <circle cx="140" cy="52" r="21"/>
    <circle cx="140" cy="52" r="18"/>
    <circle cx="140" cy="118" r="18"/>
    <circle cx="140" cy="184" r="18"/>
    <circle cx="140" cy="250" r="18"/>
    <circle cx="235" cy="118" r="18"/>
  </g>
  <g fill="#7d7d7d" font-size="14" text-anchor="middle">
    <text x="140" y="57">1</text>
    <text x="140" y="123">2</text>
    <text x="140" y="189">3</text>
    <text x="140" y="255">4</text>
    <text x="235" y="123">5</text>
  </g>

  <!-- 右：find(4) 之后 -->
  <g stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#dsu-arrow)">
    <line x1="360" y1="144" x2="478" y2="82"/>
    <line x1="440" y1="144" x2="485" y2="82"/>
    <line x1="520" y1="144" x2="492" y2="82"/>
    <line x1="600" y1="144" x2="499" y2="82"/>
  </g>
  <g fill="none" stroke="#8a8a8a" stroke-width="1.5">
    <circle cx="490" cy="60" r="21"/>
    <circle cx="490" cy="60" r="18"/>
    <circle cx="360" cy="160" r="16"/>
    <circle cx="440" cy="160" r="16"/>
    <circle cx="520" cy="160" r="16"/>
    <circle cx="600" cy="160" r="16"/>
  </g>
  <g fill="#7d7d7d" font-size="14" text-anchor="middle">
    <text x="490" y="65">1</text>
    <text x="360" y="165">2</text>
    <text x="440" y="165">3</text>
    <text x="520" y="165">4</text>
    <text x="600" y="165">5</text>
  </g>

  <g fill="#7d7d7d" font-size="12" text-anchor="middle">
    <text x="140" y="24">find(4) 之前</text>
    <text x="470" y="24">find(4) 之后</text>
    <text x="140" y="286">4 → 3 → 2 → 1，走三步</text>
    <text x="470" y="286">路径上的点全部直挂到根，再查一步</text>
  </g>
</svg>
