<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 368" width="680" height="368" role="img" aria-label="split 按 40 切：40 卡在 30 和 45 之间，从根沿一条路往下走，每层把当前结点归到 x 或 y 一侧，45 从 30 的右儿子变成 50 的左儿子">
  <rect width="680" height="368" fill="#ffffff"/>
  <defs>
    <marker id="sp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">

    <!-- ============ 左：原树，高亮递归路径 ============ -->
    <text x="160" y="22" text-anchor="middle" font-size="12.5" fill="#3a3a3a">split(root, 40)：只沿一条路走</text>

    <!-- 没走的两条边用浅灰 -->
    <g stroke="#cccccc" stroke-width="1.4" fill="none">
      <line x1="120" y1="158" x2="60" y2="216"/>
      <line x1="200" y1="68" x2="274" y2="126"/>
    </g>
    <!-- 走过的两段用橙 -->
    <g stroke="#c8823a" stroke-width="2.4" fill="none">
      <line x1="200" y1="68" x2="132" y2="126"/>
      <line x1="120" y1="158" x2="186" y2="216"/>
    </g>

    <!-- 40 这条界：卡在 30 和 45 中间，只把树分成左右两半 -->
    <line x1="158" y1="112" x2="158" y2="258" stroke="#c8823a" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.8"/>
    <rect x="130" y="265" width="56" height="17" fill="#ffffff"/>
    <text x="158" y="278" text-anchor="middle" font-size="10.5" fill="#c8823a">val = 40</text>

    <!-- 50 -->
    <circle cx="166" cy="58" r="8" fill="#c8823a"/>
    <text x="166" y="61.5" text-anchor="middle" font-size="9" fill="#ffffff">1</text>
    <rect x="174" y="43" width="52" height="30" rx="4" fill="#fff" stroke="#c8823a" stroke-width="1.8"/>
    <text x="200" y="57" text-anchor="middle" font-size="12" fill="#3a3a3a">50</text>
    <text x="200" y="68" text-anchor="middle" font-size="9" fill="#c8823a">key 21</text>

    <!-- 30 -->
    <circle cx="86" cy="148" r="8" fill="#c8823a"/>
    <text x="86" y="151.5" text-anchor="middle" font-size="9" fill="#ffffff">2</text>
    <rect x="94" y="133" width="52" height="30" rx="4" fill="#fff" stroke="#c8823a" stroke-width="1.8"/>
    <text x="120" y="147" text-anchor="middle" font-size="12" fill="#3a3a3a">30</text>
    <text x="120" y="158" text-anchor="middle" font-size="9" fill="#c8823a">key 26</text>

    <!-- 45 -->
    <circle cx="231" cy="238" r="8" fill="#c8823a"/>
    <text x="231" y="241.5" text-anchor="middle" font-size="9" fill="#ffffff">3</text>
    <rect x="170" y="223" width="52" height="30" rx="4" fill="#fff" stroke="#c8823a" stroke-width="1.8"/>
    <text x="196" y="237" text-anchor="middle" font-size="12" fill="#3a3a3a">45</text>
    <text x="196" y="248" text-anchor="middle" font-size="9" fill="#c8823a">key 38</text>

    <!-- 跟包的 20、70 -->
    <rect x="22" y="223" width="52" height="30" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <text x="48" y="237" text-anchor="middle" font-size="12" fill="#3a3a3a">20</text>
    <text x="48" y="248" text-anchor="middle" font-size="9" fill="#c8823a">key 44</text>

    <rect x="260" y="133" width="52" height="30" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <text x="286" y="147" text-anchor="middle" font-size="12" fill="#3a3a3a">70</text>
    <text x="286" y="158" text-anchor="middle" font-size="9" fill="#c8823a">key 33</text>

    <text x="160" y="298" text-anchor="middle" font-size="10.5" fill="#8a8a8a">① 50 &gt; 40：50 归 y，往左子树继续</text>
    <text x="160" y="316" text-anchor="middle" font-size="10.5" fill="#8a8a8a">② 30 ≤ 40：30 归 x，往右子树继续</text>
    <text x="160" y="334" text-anchor="middle" font-size="10.5" fill="#8a8a8a">③ 45 &gt; 40：45 归 y，挂到 50 的左边</text>
    <text x="160" y="352" text-anchor="middle" font-size="10.5" fill="#c8823a">判断只看 val，不看结点在树上的位置</text>

    <!-- ============ 中间箭头 ============ -->
    <line x1="316" y1="110" x2="352" y2="110" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#sp-arrow)" fill="none"/>
    <text x="334" y="98" text-anchor="middle" font-size="10" fill="#8a8a8a">回填</text>

    <!-- ============ 右：两棵树 ============ -->
    <text x="510" y="22" text-anchor="middle" font-size="12.5" fill="#3a3a3a">拆完：x 全是 ≤ 40，y 全是 &gt; 40</text>

    <text x="382" y="72" font-size="10.5" fill="#c8823a">x</text>
    <g stroke="#8a8a8a" stroke-width="1.4" fill="none">
      <line x1="410" y1="110" x2="368" y2="158"/>
    </g>
    <rect x="384" y="80" width="52" height="30" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <text x="410" y="94" text-anchor="middle" font-size="12" fill="#3a3a3a">30</text>
    <text x="410" y="105" text-anchor="middle" font-size="9" fill="#c8823a">key 26</text>
    <rect x="334" y="160" width="52" height="30" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <text x="360" y="174" text-anchor="middle" font-size="12" fill="#3a3a3a">20</text>
    <text x="360" y="185" text-anchor="middle" font-size="9" fill="#c8823a">key 44</text>

    <text x="524" y="72" font-size="10.5" fill="#c8823a">y</text>
    <g stroke="#8a8a8a" stroke-width="1.4" fill="none">
      <line x1="560" y1="110" x2="520" y2="158"/>
      <line x1="560" y1="110" x2="602" y2="158"/>
    </g>
    <rect x="534" y="80" width="52" height="30" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <text x="560" y="94" text-anchor="middle" font-size="12" fill="#3a3a3a">50</text>
    <text x="560" y="105" text-anchor="middle" font-size="9" fill="#c8823a">key 21</text>
    <rect x="486" y="160" width="52" height="30" rx="4" fill="#fff" stroke="#c8823a" stroke-width="1.8"/>
    <text x="512" y="174" text-anchor="middle" font-size="12" fill="#3a3a3a">45</text>
    <text x="512" y="185" text-anchor="middle" font-size="9" fill="#c8823a">key 38</text>
    <rect x="584" y="160" width="52" height="30" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <text x="610" y="174" text-anchor="middle" font-size="12" fill="#3a3a3a">70</text>
    <text x="610" y="185" text-anchor="middle" font-size="9" fill="#c8823a">key 33</text>

    <text x="510" y="298" text-anchor="middle" font-size="10.5" fill="#8a8a8a">20、70 一步没动，整块跟着走</text>
    <text x="510" y="316" text-anchor="middle" font-size="10.5" fill="#c8823a">45 换了父亲：30 的右儿子 → 50 的左儿子</text>
    <text x="510" y="334" text-anchor="middle" font-size="10.5" fill="#8a8a8a">40 本身不在树上，它只是条界</text>

  </g>
</svg>
