<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-label="线段树一次区间更新走的路：根和两层祖先只路过，三个被整段命中的节点直接改值并记懒标记，其余分支根本没进去">
  <rect width="680" height="400" fill="#ffffff"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">

    <text x="340" y="26" text-anchor="middle" font-size="12.5" fill="#3a3a3a">update(2, 5, +3)：只有三个节点整段命中</text>

    <!-- ============ 走过的边 ============ -->
    <g stroke="#8a8a8a" stroke-width="1.4" fill="none">
      <line x1="307" y1="89" x2="175" y2="123"/>
      <line x1="307" y1="89" x2="439" y2="123"/>
      <line x1="175" y1="161" x2="109" y2="195"/>
      <line x1="175" y1="161" x2="241" y2="195"/>
      <line x1="439" y1="161" x2="373" y2="195"/>
      <line x1="109" y1="233" x2="142" y2="267"/>
      <line x1="373" y1="233" x2="340" y2="267"/>
    </g>

    <!-- ============ 没走的边 ============ -->
    <g stroke="#cccccc" stroke-width="1.3" fill="none">
      <line x1="109" y1="233" x2="76" y2="267"/>
      <line x1="439" y1="161" x2="505" y2="195"/>
      <line x1="373" y1="233" x2="406" y2="267"/>
      <line x1="505" y1="233" x2="472" y2="267"/>
      <line x1="505" y1="233" x2="538" y2="267"/>
      <line x1="241" y1="233" x2="208" y2="267"/>
      <line x1="241" y1="233" x2="274" y2="267"/>
    </g>

    <!-- ============ 走过的节点 ============ -->
    <rect x="279" y="51" width="56" height="38" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <text x="307" y="76" text-anchor="middle" font-size="11" fill="#3a3a3a">[1, 8]</text>

    <rect x="147" y="123" width="56" height="38" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <text x="175" y="148" text-anchor="middle" font-size="11" fill="#3a3a3a">[1, 4]</text>

    <rect x="411" y="123" width="56" height="38" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <text x="439" y="148" text-anchor="middle" font-size="11" fill="#3a3a3a">[5, 8]</text>

    <rect x="81" y="195" width="56" height="38" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <text x="109" y="220" text-anchor="middle" font-size="11" fill="#3a3a3a">[1, 2]</text>

    <rect x="345" y="195" width="56" height="38" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <text x="373" y="220" text-anchor="middle" font-size="11" fill="#3a3a3a">[5, 6]</text>

    <!-- ============ 整段命中的三个 ============ -->
    <rect x="213" y="195" width="56" height="38" rx="4" fill="#fff" stroke="#c8823a" stroke-width="1.8"/>
    <text x="241" y="214" text-anchor="middle" font-size="11" fill="#3a3a3a">[3, 4]</text>
    <text x="241" y="226" text-anchor="middle" font-size="9.5" fill="#c8823a">+6</text>

    <rect x="114" y="267" width="56" height="38" rx="4" fill="#fff" stroke="#c8823a" stroke-width="1.8"/>
    <text x="142" y="286" text-anchor="middle" font-size="11" fill="#3a3a3a">[2, 2]</text>
    <text x="142" y="298" text-anchor="middle" font-size="9.5" fill="#c8823a">+3</text>

    <rect x="312" y="267" width="56" height="38" rx="4" fill="#fff" stroke="#c8823a" stroke-width="1.8"/>
    <text x="340" y="286" text-anchor="middle" font-size="11" fill="#3a3a3a">[5, 5]</text>
    <text x="340" y="298" text-anchor="middle" font-size="9.5" fill="#c8823a">+3</text>

    <!-- ============ 没进去的节点 ============ -->
    <g stroke="#cccccc" stroke-width="1.3" fill="none" stroke-dasharray="4 3">
      <rect x="54" y="267" width="44" height="34" rx="4"/>
      <rect x="186" y="267" width="44" height="34" rx="4"/>
      <rect x="252" y="267" width="44" height="34" rx="4"/>
      <rect x="384" y="267" width="44" height="34" rx="4"/>
      <rect x="450" y="267" width="44" height="34" rx="4"/>
      <rect x="516" y="267" width="44" height="34" rx="4"/>
      <rect x="483" y="195" width="44" height="34" rx="4"/>
    </g>
    <g font-size="9.5" fill="#b0b0b0" text-anchor="middle">
      <text x="76" y="288">[1, 1]</text>
      <text x="208" y="288">[3, 3]</text>
      <text x="274" y="288">[4, 4]</text>
      <text x="406" y="288">[6, 6]</text>
      <text x="472" y="288">[7, 7]</text>
      <text x="538" y="288">[8, 8]</text>
      <text x="505" y="217">[7, 8]</text>
    </g>

    <!-- ============ 图例 ============ -->
    <rect x="80" y="332" width="16" height="11" rx="2" fill="#fff" stroke="#c8823a" stroke-width="1.6"/>
    <text x="104" y="341" font-size="10.5" fill="#555">整段命中：改 tr、记 lazy，就此打住，不往下递归</text>

    <rect x="80" y="352" width="16" height="11" rx="2" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
    <text x="104" y="361" font-size="10.5" fill="#555">部分覆盖：pushdown 之后继续分岔</text>

    <rect x="400" y="352" width="16" height="11" rx="2" fill="#fff" stroke="#cccccc" stroke-width="1.3" stroke-dasharray="3 2"/>
    <text x="424" y="361" font-size="10.5" fill="#999">这条路根本没进去</text>

    <text x="340" y="386" text-anchor="middle" font-size="10.5" fill="#c8823a">回程时沿途每个灰节点都要 pushup 一次——漏了这步，样例能过、连着查两次就错</text>

  </g>
</svg>
